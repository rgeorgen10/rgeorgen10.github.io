<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 4 - Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./resources/css/style.css">
</head>

<body>
    <div class="row">
        <div class="col-2">
            <div class="custom-container">
                <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#event_modal">Create
                    Event</button>
            </div>
        </div>
        <div class="col">
            <div class="container-md container-fluid py-4 h-100">
                <div id="calendar" class="row h-100">
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="sunday">
                        <div class="h6 text-center position-relative py-2 day">
                            Sunday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="monday">
                        <div class="h6 text-center position-relative py-2 day">
                            Monday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="tuesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Tuesday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="wednesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Wednesday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="thursday">
                        <div class="h6 text-center position-relative py-2 day">
                            Thursday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="friday">
                        <div class="h6 text-center position-relative py-2 day">
                            Friday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="saturday">
                        <div class="h6 text-center position-relative py-2 day">
                            Saturday
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--Code for modal-->
    <div class="modal fade" id="event_modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Create new calendar event</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="event_form" onsubmit="saveEvent(); return false;">
                        <div class="mb-3">
                            <label for="event-name" class="col-form-label">Event Name:</label>
                            <input type="text" class="form-control" id="event-name" required>
                        </div>

                        <div class="mb-3">
                            <select id="event_weekday" aria-label="Select day of the week" required>
                                <option value="" selected disabled>Select Day of the Week</option>
                                <option value="sunday">Sunday</option>
                                <option value="monday">Monday</option>
                                <option value="tuesday">Tuesday</option>
                                <option value="wednesday">Wednesday</option>
                                <option value="thursday">Thursday</option>
                                <option value="friday">Friday</option>
                                <option value="saturday">Saturday</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="event_time" class="col-form-label">Time:</label>
                            <input type="time" class="form-control" id="event_time" required>
                        </div>

                        <div class="mb-3">
                            <select id="event_modality" aria-label="Enter modality" required
                                onchange="updateLocationOptions()">
                                <option value="" selected disabled>Enter Modality</option>
                                <option value="1">Remote</option>
                                <option value="2">In-Person</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="event_location" class="col-form-label">Location:</label>
                            <input type="text" class="form-control" id="event_location" disabled>
                        </div>

                        <div class="mb-3">
                            <label for="event_remote_url" class="col-form-label">Remote URL:</label>
                            <input type="url" class="form-control" id="event_remote_url" pattern="https?://[^\s]+"
                                placeholder="https://example.com" disabled>
                        </div>

                        <div class="mb-3">
                            <label for="event_attendees" class="col-form-label">Attendees:</label>
                            <input type="text" class="form-control" id="event_attendees"
                                placeholder="Enter names separated by commas" required>
                        </div>
                        <div class="mb-3">
                            <select id="event_category" aria-label="Select category" required>
                                <option value="" selected disabled>Select Category</option>
                                <option value="Academic">Academic</option>
                                <option value="Personal">Personal</option>
                                <option value="Work">Work</option>
                                <option value="Social">Social</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary" form="event_form">Save</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="./resources/js/script.js"></script>
</body>

</html>
